name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: node --check app.js && node --check sw.js

      - name: 仿真测试（播放/暂停/锁屏控件/音量/音源）
        run: node test/simulation.mjs
