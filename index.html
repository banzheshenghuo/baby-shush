<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="婴儿嘘嘘哄睡：真实「嘘」声录音循环播放，配合呼吸律动动画，支持锁屏 / 息屏持续播放">
  <meta name="theme-color" content="#0b0e1e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="audio/xuxu.mp3" as="audio" type="audio/mpeg">
  <title>婴儿嘘嘘哄睡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>嘘嘘哄睡</h1>
    <p class="subtitle">柔和「嘘」声 · 呼吸节奏律动</p>

    <section class="breath-stage" aria-live="polite" aria-atomic="true">
      <button class="breath-circle" id="circle" aria-label="播放或暂停">
        <span class="state" id="stateLabel">轻触开始</span>
      </button>
    </section>

    <p class="hint" id="hint">轻触中间的圆圈开始播放</p>

    <p class="timer" id="timer" hidden>本次 00:00</p>

    <p class="tip">音量请用设备音量键调节 · 建议声源距婴儿耳侧约 30–50 cm，配合轻拍安抚效果更好</p>

    <button class="history-btn" id="historyBtn">历史记录</button>
  </main>

  <div class="modal" id="historyModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="历史记录">
      <div class="modal-head">
        <h2>哄睡历史</h2>
        <button class="modal-close" id="historyClose" aria-label="关闭历史记录">✕</button>
      </div>
      <p class="history-total" id="historyTotal"></p>
      <ul class="history-list" id="historyList"></ul>
      <button class="history-clear" id="historyClear">清空历史</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
